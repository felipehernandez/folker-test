version: 2.1

parameters:
  image-version:
    type: string
    default: "3.0"

orbs:
  python: circleci/python@2.2.0

executors:
  docker-builder:
    docker:
      - image: circleci/buildpack-deps:stretch
  integration-test-runner:
    machine: true # Linux VM instead of docker environment
  docker-publisher:
    docker:
      - image: circleci/buildpack-deps:stretch
jobs:
  build:
    executor: 
      name: python/default
      tag: "3.10"
    steps:
      - checkout
      - persist_to_workspace:
          root: .
          paths:
            - ./

  unit-tests:
    parameters:
      python-version:
        type: string
    executor:
      name: python/default
      tag: <<parameters.python-version>>
    steps:
      - checkout
      - run:
          name: Python version
          command: python --version
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements.txt
      - run:
          name: Test
          command: |
            coverage run -m pytest --junitxml codecoverage/unittests.xml
            coverage report -m
            coverage xml --omit='*/venv/*','tests/*' -o codecoverage/coverage.xml
            coverage html --omit='*/venv/*','tests/*' -d codecoverage
      - store_test_results:
          path: codecoverage
      - store_artifacts:
          path: codecoverage

  run-integration-tests:
    executor: integration-test-runner
    parameters:
      tests:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run: |
          for i in $(seq 1 3); do
            eval docker-compose run integration-tests-<<parameters.tests>> && s=0 && break || s=$? && sleep 10;
          done;
          (exit $s)

  validate-integration-tests:
    executor: integration-test-runner
    steps:
      - run: echo "Integration tests validated"

  build-docker-image:
    executor: docker-builder
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build \
              -t folkertest/folkertest:<<pipeline.parameters.image-version>>.<<pipeline.number>> \
              -t folkertest/folkertest:beta \
              -t folkertest/folkertest:latest \
              .
      - run:
          name: Archive Docker image
          command: docker save -o folkertest.tar folkertest/folkertest
      - persist_to_workspace:
          root: .
          paths:
            - ./folkertest.tar

  publish-docker-image:
    executor: docker-builder
    parameters:
      image-label:
        type: string
        default: beta
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Load Docker image
          command: docker load -i ./folkertest.tar
      - run:
          name: Login Dockerhub
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Publish docker image as <<pipeline.parameters.image-version>>.<<pipeline.number>>
          command: |
            docker push folkertest/folkertest:<<pipeline.parameters.image-version>>.<<pipeline.number>>
      - run:
          name: Publish docker image as <<parameters.image-label>>
          command: |
            docker push folkertest/folkertest:<<parameters.image-label>>

workflows:
  version: 2.1

  development:
    when:
      and:
        - not:
            equal: [ beta, << pipeline.git.branch >> ]
        - not:
            equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - build
      - unit-tests:
        matrix:
          parameters:
            python-version: ["3.10"]
      - run-integration-tests:
          matrix:
            parameters:
              tests:
                - code
                - conditional
                - file
                - foreach
                - gmail
                - graphql
                - grpc
                - kafka
                - rest
                - parallel
                - postgres
                - print
                - profile
                - protobuf
                - pubsub
                - rabbitmq
                - save
                - template
                - void
                - wait
                - zookeeper
          requires:
            - build
            - unit-tests
      - validate-integration-tests:
          requires:
            - run-integration-tests
  beta:
    when:
      equal: [ beta, << pipeline.git.branch >> ]
    jobs:
      - build
      - unit-tests:
        matrix:
          parameters:
            python-version: ["3.10"]
      - run-integration-tests:
          matrix:
            parameters:
              tests:
                - code
                - conditional
                - file
                - foreach
                - gmail
                - graphql
                - grpc
                - kafka
                - rest
                - parallel
                - postgres
                - print
                - profile
                - protobuf
                - pubsub
                - rabbitmq
                - save
                - template
                - void
                - wait
                - zookeeper
          requires:
            - build
            - unit-tests
      - validate-integration-tests:
          requires:
            - run-integration-tests
      - build-docker-image:
          requires:
            - build
            - validate-integration-tests
      - publish-docker-image:
          name: publish-beta
          image-label: beta
          requires:
            - build-docker-image

  main:
    when:
      equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - build
      - unit-tests:
        matrix:
          parameters:
            python-version: ["3.10"]
      - run-integration-tests:
          matrix:
            parameters:
              tests:
                - code
                - conditional
                - file
                - foreach
                - gmail
                - graphql
                - grpc
                - kafka
                - rest
                - parallel
                - postgres
                - print
                - profile
                - protobuf
                - pubsub
                - rabbitmq
                - save
                - template
                - void
                - wait
                - zookeeper
          requires:
            - build
            - unit-tests
      - validate-integration-tests:
          requires:
            - run-integration-tests
      - build-docker-image:
          requires:
            - build
            - validate-integration-tests
      - publish-docker-image:
          name: publish-latest
          image-label: latest
          requires:
            - build-docker-image
