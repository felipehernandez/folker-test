version: 2.1

parameters:
  image-version:
    type: string
    default: "3.0"
  python-version:
    # Runtime Python version. Must equal .python-version (CI-12, checked by the lint job).
    type: string
    default: "3.10"

orbs:
  python: circleci/python@4.0.0

executors:
  docker-builder:
    docker:
      - image: circleci/buildpack-deps:stretch
  integration-test-runner:
    machine: true # Linux VM instead of docker environment
  docker-publisher:
    docker:
      - image: circleci/buildpack-deps:stretch
jobs:
  build:
    executor:
      name: python/default
      tag: << pipeline.parameters.python-version >>
    steps:
      - checkout
      - persist_to_workspace:
          root: .
          paths:
            - ./

  unit-tests:
    parameters:
      python-version:
        type: string
    executor:
      name: python/default
      tag: << parameters.python-version >>
    steps:
      - checkout
      - run:
          name: Python version
          command: python --version
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements.txt
      - run:
          name: Test
          command: |
            coverage run -m pytest --junitxml codecoverage/unittests.xml
            coverage report -m
            coverage xml --omit='*/venv/*','tests/*' -o codecoverage/coverage.xml
            coverage html --omit='*/venv/*','tests/*' -d codecoverage
      - store_test_results:
          path: codecoverage
      - store_artifacts:
          path: codecoverage

  lint:
    executor:
      name: python/default
      tag: << pipeline.parameters.python-version >>
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements-lint.txt
      - run:
          name: Ruff
          command: ruff check .
      - run:
          name: Python version is declared consistently
          command: python scripts/check_python_version.py

  build-docker-image:
    executor: docker-builder
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Build runtime and integration images
          command: |
            PYTHON_VERSION="$(cat .python-version)"
            docker build --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
              --target runtime -t folkertest/folkertest:ci .
            docker build --build-arg PYTHON_VERSION="$PYTHON_VERSION" \
              --target integration -t folkertest/folkertest-integration:ci .
      - run:
          name: Archive images
          command: docker save -o folkertest.tar folkertest/folkertest:ci folkertest/folkertest-integration:ci
      - persist_to_workspace:
          root: .
          paths:
            - ./folkertest.tar

  run-integration-tests:
    executor: integration-test-runner
    parameters:
      tests:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Load the image under test
          command: |
            docker load -i folkertest.tar
            # compose must run the loaded image, never rebuild one
            docker image inspect folkertest/folkertest-integration:ci > /dev/null
      - run:
          name: Run integration tests
          command: |
            for i in $(seq 1 3); do
              eval docker-compose run integration-tests-<<parameters.tests>> && s=0 && break || s=$? && sleep 10;
            done;
            (exit $s)

  validate-integration-tests:
    executor: integration-test-runner
    steps:
      - run: echo "Integration tests validated"

  publish-docker-image:
    executor: docker-publisher
    parameters:
      image-label:
        type: string
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Load the tested image
          command: docker load -i ./folkertest.tar
      - run:
          name: Tag the tested image
          command: |
            docker tag folkertest/folkertest:ci folkertest/folkertest:<<pipeline.parameters.image-version>>.<<pipeline.number>>
            docker tag folkertest/folkertest:ci folkertest/folkertest:<<parameters.image-label>>
      - run:
          name: Login Dockerhub
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Publish docker image as <<pipeline.parameters.image-version>>.<<pipeline.number>>
          command: |
            docker push folkertest/folkertest:<<pipeline.parameters.image-version>>.<<pipeline.number>>
      - run:
          name: Publish docker image as <<parameters.image-label>>
          command: |
            docker push folkertest/folkertest:<<parameters.image-label>>

workflows:
  # One workflow for every branch (CI-06). Only publishing depends on the branch.
  build-test-publish:
    jobs:
      - build
      - lint
      - unit-tests:
          matrix:
            parameters:
              # Runtime version first; DEP-04 adds the next target version here
              python-version: [<< pipeline.parameters.python-version >>]
      - build-docker-image:
          requires:
            - build
      - run-integration-tests:
          matrix:
            parameters:
              tests:
                - code
                - conditional
                - file
                - foreach
                - gmail
                - graphql
                - grpc
                - kafka
                - rest
                - parallel
                - postgres
                - print
                - profile
                - protobuf
                - pubsub
                - rabbitmq
                - save
                - template
                - void
                - wait
                - zookeeper
          requires:
            - build-docker-image
            - unit-tests
            - lint
      - validate-integration-tests:
          requires:
            - run-integration-tests
      - publish-docker-image:
          name: publish-beta
          image-label: beta
          requires:
            - validate-integration-tests
          filters:
            branches:
              only: beta
      - publish-docker-image:
          name: publish-latest
          image-label: latest
          requires:
            - validate-integration-tests
          filters:
            branches:
              only: main
