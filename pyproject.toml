[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folker-test"
version = "2.5"
description = "Test and simple tasks automation tool"
license = { text = "proprietary" }
authors = [{ name = "Felipe Hernandez", email = "felherlla@gmail.com" }]
requires-python = ">=3.10"
# Direct dependencies are pinned exactly (Renovate bumps them); uv.lock pins the transitive ones.
# `coverage` and `pylint` still ship at runtime until DEP-02 moves them out.
dependencies = [
    "certifi==2023.11.17",
    "chardet==7.7.0",
    "click==8.5.1",
    "coverage",
    "google==3.0.0",
    "google-api-python-client==2.202.0",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "google-cloud-pubsub==2.39.0",
    "gql==2.0.0",
    "grpcio==1.85.3",
    "grpcio-tools==1.70.0",
    "httplib2==0.22.0",
    "idna==3.10",
    "kafka-python==2.2.15",
    "kazoo==2.10.0",
    "marshmallow==3.22.0",
    "marshmallow-oneofschema==3.1.1",
    "mergedeep==1.3.4",
    "oauth2client==4.1.3",
    "pika==1.5.0",
    "protobuf==5.29.6",
    "psycopg2-binary==2.9.10",
    "pylint==3.2.7",
    "pyOpenSSL==23.3.0",
    "PyYAML==6.0.2",
    "requests==2.32.4",
]

[project.scripts]
folker-test = "folker.cli:run"

[dependency-groups]
test = [
    "coverage[toml]==7.16.2",
    "pytest==7.4.4",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-mock==3.17.0",
]
lint = [
    "ruff==0.17.6",
]
# What `uv sync` installs by default: everything a contributor needs.
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.setuptools.packages.find]
include = ["folker*"]

[tool.uv]
# Fail early on an older uv instead of writing a lock file the pinned one cannot read.
required-version = ">=0.13"
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W6"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
    "cli: tests that validate possible execution configurations",
    "logger: tests that validate application logging",
    "action_correctness: tests that validate an action schema",
    "action_code: code action",
    "action_file: file action",
    "action_gcp_pubsub: Google Cloud Pub/Sub action",
    "action_gmail: Gmail action",
    "action_graphql: GraphQL action",
    "action_grpc: gRPC action",
    "action_kafka: Kafka action",
    "action_postgres: Postgres action",
    "action_print: print action",
    "action_protobuf: Protobuf action",
    "action_rest: REST action",
    "action_void: void action",
    "action_wait: wait action",
    "action_zookeeper: ZooKeeper action",
    "action_rabbitmq: RabbitMQ action",
]
# Later entries are checked first. Ignore only third-party warnings we cannot
# fix without a dependency upgrade. pkg_resources warns on import (stacklevel
# points at google-cloud-pubsub 1.7.2, DEP-05) and on declare_namespace.
# httplib2 still calls deprecated pyparsing APIs. Warnings from our code stay errors.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:pkg_resources is deprecated:DeprecationWarning",
    "ignore:pkg_resources.declare_namespace:DeprecationWarning",
    "ignore::DeprecationWarning:httplib2",
]

[tool.coverage.run]
# source_pkgs, not source: same numbers, but report paths stay repo-relative
# (folker/cli.py), so a future Sonar/Codecov upload maps files correctly.
source_pkgs = ["folker"]
branch = true

[tool.coverage.report]
# Ratchet (CI-03): line+branch coverage of folker/. Raise this when coverage
# goes up; never lower it to make a PR pass. Baseline 86.42% on 2026-11-10.
fail_under = 86.4
precision = 2
show_missing = true
