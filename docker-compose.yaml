# Integration test runners share one image: the `integration` target of Dockerfile, i.e. the
# published runtime plus example fixtures (CI-04). CI loads the image it built and tested, so
# compose finds it locally and skips the build; locally, `docker compose run` builds it.
x-integration-test: &integration-test
  image: folkertest/folkertest-integration:ci
  build:
    context: .
    target: integration
    args:
      PYTHON_VERSION: ${PYTHON_VERSION:-3.10}

services:
  mockserver:
    image: mockserver/mockserver:latest
    ports:
      - 1080:1080

  gcp-pubsub-emulator:
    image: messagebird/gcloud-pubsub-emulator:latest
    ports:
      - 8681:8681
    environment:
      PUBSUB_PROJECT1: "folker-test-gcp-test,a_topic:a_subscription"
    # The image opens port 8682 only after it has created the topics and subscriptions from
    # PUBSUB_PROJECT1, so a TCP check on it proves the fixtures exist. Tool: bash /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8682"]
      interval: 5s
      timeout: 5s
      retries: 20

  grpc-test-server:
    image: folkertest/grpc-test-server:latest
    ports:
      - 8682:8682
    # Proves the server accepts connections. Tool: bash /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8682"]
      interval: 5s
      timeout: 5s
      retries: 20

  graphql-test-server:
    image: folkertest/graphql-test-server:latest
    ports:
      - 8683:8683
    # Proves the server accepts connections. Tool: bash /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8683"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-server:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
    # -h 127.0.0.1 is required: without it pg_isready uses the unix socket, which the temporary
    # server of the image's first-start init also answers, so it could report healthy early.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  zookeeper:
    image: zookeeper:3.9.7
    ports:
      - 2181:2181
    # Proves ZooKeeper answers the `srvr` four-letter command. Tool: nc.
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Zxid"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    ports:
      - 9092:9092
      - 9093:9093
    environment:
      # Single-node KRaft (combined broker + controller)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      # Single broker: internal topics can't be replicated
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # Proves the broker answers an API request on the INSIDE listener. The probe starts a JVM,
    # hence the longer interval/timeout.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9093 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ./.circleci/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./.circleci/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
    # Proves the node is running and the definitions (vhost `test`, queues) have been imported.
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmqctl -q list_queues -p test name | grep -qx test-exchange-single.queue-single-1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  integration-tests-template:
    <<: *integration-test
    command: -t template -n 3 --trace
    depends_on:
      mockserver:
        condition: service_healthy
  integration-tests-profile:
    <<: *integration-test
    command: -p test-profile -t profile -n 1 --trace
  integration-tests-parallel:
    <<: *integration-test
    command: -t parallel -n 3 --trace
  integration-tests-conditional:
    <<: *integration-test
    command: -t conditional -n 1 --trace
  integration-tests-foreach:
    <<: *integration-test
    command: -t foreach -n 2 --trace
  integration-tests-save:
    <<: *integration-test
    command: -t save -n 2 --trace
  integration-tests-void:
    <<: *integration-test
    command: -t void -n 3 --trace
  integration-tests-print:
    <<: *integration-test
    command: -t print -n 3 --trace
  integration-tests-wait:
    <<: *integration-test
    command: -t wait -n 1 --trace
  integration-tests-rest:
    <<: *integration-test
    command: -t rest -n 3 --trace
    depends_on:
      mockserver:
        condition: service_healthy
  integration-tests-postgres:
    <<: *integration-test
    command: -t postgres -n 1 --trace
    depends_on:
      postgres-server:
        condition: service_healthy
  integration-tests-file:
    <<: *integration-test
    command: -t file -n 1 --trace
  integration-tests-code:
    <<: *integration-test
    command: -t code -n 1 --trace
  integration-tests-gmail:
    <<: *integration-test
    command: -t gmail -n 1 --trace
  integration-tests-protobuf:
    <<: *integration-test
    command: -t protobuf -n 2 --trace
    depends_on:
      mockserver:
        condition: service_healthy
  integration-tests-grpc:
    <<: *integration-test
    command: -t grpc -n 1 --trace
    depends_on:
      grpc-test-server:
        condition: service_healthy
  integration-tests-graphql:
    <<: *integration-test
    command: -t graphql -n 1 --trace
    depends_on:
      graphql-test-server:
        condition: service_healthy
  integration-tests-pubsub:
    <<: *integration-test
    command: -t pubsub -n 1 --trace
    depends_on:
      gcp-pubsub-emulator:
        condition: service_healthy
  integration-tests-kafka:
    <<: *integration-test
    command: -t kafka -n 1 --trace
    depends_on:
      kafka:
        condition: service_healthy
  integration-tests-zookeeper:
    <<: *integration-test
    command: -t zookeeper -n 4 --trace
    depends_on:
      zookeeper:
        condition: service_healthy
  integration-tests-rabbitmq:
    <<: *integration-test
    command: -t rabbitmq -n 4 --trace
    depends_on:
      rabbitmq:
        condition: service_healthy
